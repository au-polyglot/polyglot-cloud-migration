name: CI Pipeline

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore backend-dotnet/src/Api.csproj
      - name: Build
        run: dotnet build backend-dotnet/src/Api.csproj
      - name: Format check
        run: dotnet format backend-dotnet/src/Api.csproj --verify-no-changes --no-restore
        continue-on-error: true

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install flake8 pytest
      - name: Lint with flake8
        run: flake8 worker-python/src/worker.py --max-line-length=100 --extend-ignore=W292,W293
      - name: Run tests
        run: pytest worker-python/tests/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: cd frontend-js/src && npm install
      - name: Build
        run: cd frontend-js/src && npm run build

  build-and-push:
    needs: [test-backend, test-python, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-dotnet
          push: true
          tags: warishaabid/polyglot-backend:latest
      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker-python
          push: true
          tags: warishaabid/polyglot-worker:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-js
          push: true
          tags: warishaabid/polyglot-frontend:latest
      - name: Trigger Jenkins
        run: |
          curl -X POST http://${{ secrets.JENKINS_URL }}/job/polyglot-deploy/build \
            --user ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }} || true